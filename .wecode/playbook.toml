# How work is broken down in this project.
#
# Read by whoever decomposes a request into tasks — usually an orchestrator agent,
# via `wecode playbook <kind>`. It is guidance, not a workflow anything runs: the
# tasks it produces are still checked by the admission gate.
#
# Committed to the repo on purpose, so it is versioned with the code it describes.
# `.wecode/run/` is the worker-writable area and is gitignored; this file is not.

[project]
merge_to = "master"
merge    = "approved"   # the charter protects master anyway
language = "rust"
# The integration branch. Task branches are cut from it.
# Unset for now: this repo works on master directly, and naming a branch that does
# not exist would fail at `wecode start`.

# Decisions already taken live in docs/wecode/<task>/design.md. Read the one matching
# your task id before writing anything, and check docs/wecode/ for a design that names
# what you are about to build — implementing against a decision that was already made
# and signed is cheaper than re-deriving it, and re-deriving it differently is worse
# than either.

# Traps that have cost a task each, in this repo:
#
#   A task that adds or changes a CLI command also changes docs/reference/commands.md
#   and docs/reference/schema.md — both are generated from the source, so they move
#   whether or not you touch them. Declare docs/** or the scope check refuses the work
#   after it is done, and acceptance is frozen so the task cannot be repaired.
#
#   A task that changes a crate's public API changes the crate defining it, its
#   Cargo.toml, and every caller. Declare the crates, not the files.
#
#   A task that pushes a file past the limit in `.max-lines` fails acceptance, and the
#   ratchet reads the whole worktree rather than the diff — so a task can be failed by
#   a file it never opened. Neither shape is repaired by widening the scope. Growing a
#   file that is already near the limit is a task that should have split it, and the
#   split is worth declaring up front, because acceptance is frozen and the run cannot
#   be repaired afterwards. Run `bash scripts/max-lines.sh` before planning: it prints
#   the tallest file in each half and how much room is left under the number.

[feature]
worktree  = true
assign_to = "impl"
accept    = [
  "cargo test --workspace",
  "cargo clippy --all-targets -- -D warnings",
  "bash scripts/max-lines.sh",
]
tokens    = 150000
wall_secs = 5400
subtasks  = ["design", "build", "test"]

guidance  = """
One main task per behaviour that changes. Subtasks only when the work spans crates —
each must be independently reviewable.

The crate boundaries are the natural seam, and they are ordered:
  core   pure types, no dependencies at all — no serde, no I/O, no async
  gov    the Broker: authorisation as a pure function of its inputs
  org    hand-edited config: company.toml and project playbooks
  store  SQLite; the database is the event bus
  cli    the only crate that executes anything

A task that needs a new type in core and its use in cli is two subtasks, in that
order, because core cannot depend on anything above it.

Tests go to `impl` along with the code: this repo keeps them beside the source, so the
tester post's tests/** scope cannot reach them. See the bug playbook.

Put the test file in the write scope. Unit tests sit inside the module being changed,
so they are covered already — but anything touching the CLI almost always edits
crates/wecode-cli/tests/cli.rs too, and leaving it out fails the scope check after the
work is done. Three tasks in a row have been caught by this.

Acceptance is an executable command, never a description. `Judged` is illegal on a
task and the gate will refuse it.

Group work into sprints. A parent task is the sprint; its subtasks are the items.
Subtasks share the parent's worktree and its branch, so a sprint costs one checkout
and one build no matter how many items it holds — and it lands on one merge
signature, because a passing subtask finishes on its own.

  parent    one outcome, one branch, one signature
  subtask   one item, verified on its own, `--parent <sprint>`

Two rules decide the grouping, and neither is about files:

  What ships together is one sprint. If you would never revert one item without
  the others, they belong to the same parent. If you would, they do not.

  A sprint goal is singular. The admission gate refuses a title naming two
  outcomes, which is the same rule: a sprint you cannot state in one sentence is
  two sprints.

Sprints that share no files run at the same time. Declare scopes as **files, not
crates** — `crates/x/src/foo.rs`, not `crates/x/**`. A crate-wide glob collides with
every other task in that crate and serialises work that never touches the same line;
seven such tasks became one chain of seven before this was written down. Name the
files, and three of them run at once.

Within a sprint, order items with `--after` when one genuinely needs the last. Do
not chain them out of habit: siblings that touch different files still share the
worktree, so they run one at a time regardless, and a false dependency only removes
the option of reordering.

Acceptance must be able to fail if the task did nothing. `cargo test` and a linter pass
perfectly against a task that changed no files — one such task exited cleanly having
written nothing at all, and the suite agreed. Name the thing being added: grep for the
flag, run the command, assert the endpoint answers. A check that inaction satisfies is
not acceptance, it is a formality.

Shipping a capability is not the same as delivering it. A task that adds a config
surface — an environment variable a hook can read, a field company.toml can set — has
not changed anything an operator touches until the config uses it, and the agent cannot
write that config by design. Say in the task what the operator must wire, and put a
worked example in docs/reference/config.md.

The test step proves the feature works in the assembled system, not that the units
compile. A suite that passes whether or not the feature is exercised has tested
nothing about it — three capabilities shipped in one evening whose tests were green
and which changed nothing an operator could see. Drive the real thing: run the
binary, call the endpoint, execute the configured hook. If the only honest proof
needs a person or a phone, say so in the task and put the worked example in the
reference docs rather than pretending a unit test covered it.

Three steps here, not four: a docs step earns its place in a project whose plan file
tracks slices, and this one keeps its documentation beside the code the same task
changes.

Expand when the decision outlives the code. A schema, an algorithm, a protocol, a
scale someone will read back in a year — those want a design signed before anything is
built against them. A one-command fix does not, and four agent runs for it is ceremony
with a bill attached. `--expand` is opt-in and the emitted subtasks are ordinary tasks:
drop the design step when the title already says the decision.
"""

[feature.design]
kind      = "design"
title     = "decide how to {{title}}"
write     = ["docs/wecode/{{task}}/design.md"]
accept    = ["test -f docs/wecode/{{task}}/design.md"]
tokens    = 200000

[feature.build]
after     = ["design"]
title     = "{{title}}"
# Crate-wide, which this playbook tells you not to write — and a template cannot know
# which files a task will touch. Narrow it on the emitted task before dispatching, or
# the subtask collides with everything else in the crate. Fixing that properly means a
# subtask inheriting its parent's declared scope; see advisory-checks.
write     = ["crates/**", "docs/**"]
accept    = ["cargo clippy --all-targets -- -D warnings", "bash scripts/max-lines.sh"]

[feature.test]
after     = ["build"]
title     = "cover {{title}} with tests"
write     = ["crates/wecode-cli/tests/**", "crates/**"]
accept    = ["cargo test --workspace", "bash scripts/max-lines.sh"]


[bug]
worktree  = true
assign_to = "impl"
accept    = ["cargo test --workspace", "bash scripts/max-lines.sh"]
tokens    = 150000
wall_secs = 2700
guidance  = """
Reproduce first.

For a small bug, one task: the test and the fix together. "One cause per task" already
makes that atomic, and a ten-line fix does not need decomposing.

For a bug big enough to split, the main task is a container and the work goes in
ordered subtasks:

  main               the bug
   ├─ …-test         a test that fails today
   └─ …-fix          --after the test

Do not make the main task the fix and the test a subtask of it: that needs the parent
to depend on its own child, and there is no way to add a dependency after a task
exists anyway. Declare `--after` when you create the task.

Both go to `impl`, not `test`. In this repo tests live beside the code — 25 src files
carry inline `#[cfg(test)] mod tests`, and the integration suite is at
crates/wecode-cli/tests/cli.rs. The tester post's scope is tests/** and spec/**, so it
can write none of them; check with `wecode guard test write <path>`.

That means the usual guarantee — a tester that cannot weaken the code to make a test
pass — does not hold for this project. Rust's convention defeats it. Do not assign
test work to `test` here expecting it to be enforced; it will be refused at the
boundary.

One cause per task. Two symptoms with one cause is one task; one symptom with two
causes is two.

State the wrong behaviour in the title, not the intended fix — "audit seq restarts
at 1 per process", not "make seq monotonic". The fix is what acceptance proves.

If the cause is unclear, make a spike subtask first. A spike needs no write scope,
which is why it is the right shape for "find out why".
"""

[refactor]
worktree  = true
assign_to = "impl"
accept    = [
  "cargo test --workspace",
  "cargo clippy --all-targets -- -D warnings",
  "bash scripts/max-lines.sh",
]
tokens    = 150000
wall_secs = 3600
guidance  = """
Behaviour must not change, so the acceptance is the existing suite passing unchanged.

Do not put tests/** or any test module in the write scope. Needing to edit a test
means behaviour changed and this is a feature or a bug, not a refactor. That is the
whole distinction from a chore.

Renaming a public item is a refactor; changing what it returns is not.

A split is the one task that lowers the ratchet, and it is the only kind that should.
`.max-lines` may only come down to the tallest file left standing, so the number moves
in the commit that lands the split and not before it — put `.max-lines` in the write
scope of a splitting task, and run `bash scripts/max-lines.sh` to read off what the
tree now allows. Leaving it where it was is not a failure; it is the next split's
opportunity, and a task that lowers the number without splitting anything has only
armed a gate against work that cannot answer it.
"""

[chore]
worktree  = true
assign_to = "impl"
accept    = ["cargo test --workspace", "bash scripts/max-lines.sh"]
tokens    = 150000
wall_secs = 1800
guidance  = """
Dependency bumps, config, tooling, gitignore. No behaviour change intended, but
unlike a refactor no claim is made about it either.

Keep these separate from feature work — a dependency bump inside a feature diff
hides both.
"""

[spike]
worktree  = false
assign_to = "impl"
accept    = ["test -f docs/theory.md"]
tokens    = 150000
wall_secs = 1800
guidance  = """
Answers a question; changes no code. Needs no write scope, which is the one
admission exemption any kind gets.

Say in the title what question is being answered, and put the answer in
docs/theory.md under the open questions — that file exists for exactly this and is
explicitly not required to implement anything.

Time-box it. A spike that turns into an implementation should have been a feature.
"""

[design]
worktree  = true   # so the document lands on a branch, and a notification can carry it
assign_to = "impl"
tokens    = 150000
wall_secs = 1800
# No default acceptance: it wants the task id in the path, and nothing substitutes one
# until `--expand` lands. Pass --accept-cmd "test -f docs/wecode/<task>/design.md".
guidance  = """
Proposes a change and writes no code. The deliverable is docs/wecode/<task>/design.md,
and it is the only kind that is not finished when it passes — it goes to needs-approval
and waits for a signature, because whether a design is right is exactly the part no
command can check.

Say what the change decides, what it costs, and what it makes harder. A design that
only lists benefits has not been thought about. Name anything in the tree that states
the opposite today, so reversing a decision is deliberate rather than accidental.
"""

[docs]
worktree  = false
assign_to = "impl"
accept    = ["test -f docs/README.md"]
tokens    = 150000
wall_secs = 1800
guidance  = """
Single task. No subtasks, no worktree — prose does not conflict the way code does,
so edit in place.

Every page describes what **exists**. Anything planned goes in plan.md; anything built
but weak goes in the gaps section of docs/features.md. Mixing the two is how the old
architecture.md became untrustworthy enough to delete.

The reasoning behind a change belongs in its commit message, where it stays true.
docs/design/decisions.md keeps only the arguments a reader still needs.
"""
