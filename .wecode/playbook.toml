# How work is broken down in this project.
#
# Read by whoever decomposes a request into tasks — usually an orchestrator agent,
# via `wecode playbook <kind>`. It is guidance, not a workflow anything runs: the
# tasks it produces are still checked by the admission gate.
#
# Committed to the repo on purpose, so it is versioned with the code it describes.
# `.wecode/run/` is the worker-writable area and is gitignored; this file is not.

[project]
merge_to = "master"
merge    = "approved"   # the charter protects master anyway
language = "rust"
# The integration branch. Task branches are cut from it.
# Unset for now: this repo works on master directly, and naming a branch that does
# not exist would fail at `wecode start`.

# Traps that have cost a task each, in this repo:
#
#   A task that adds or changes a CLI command also changes docs/reference/commands.md
#   and docs/reference/schema.md — both are generated from the source, so they move
#   whether or not you touch them. Declare docs/** or the scope check refuses the work
#   after it is done, and acceptance is frozen so the task cannot be repaired.
#
#   A task that changes a crate's public API changes the crate defining it, its
#   Cargo.toml, and every caller. Declare the crates, not the files.

[feature]
worktree  = true
assign_to = "impl"
accept    = ["cargo test --workspace", "cargo clippy --all-targets -- -D warnings"]
tokens    = 120000
wall_secs = 5400
guidance  = """
One main task per behaviour that changes. Subtasks only when the work spans crates —
each must be independently reviewable.

The crate boundaries are the natural seam, and they are ordered:
  core   pure types, no dependencies at all — no serde, no I/O, no async
  gov    the Broker: authorisation as a pure function of its inputs
  org    hand-edited config: company.toml and project playbooks
  store  SQLite; the database is the event bus
  cli    the only crate that executes anything

A task that needs a new type in core and its use in cli is two subtasks, in that
order, because core cannot depend on anything above it.

Tests go to `impl` along with the code: this repo keeps them beside the source, so the
tester post's tests/** scope cannot reach them. See the bug playbook.

Put the test file in the write scope. Unit tests sit inside the module being changed,
so they are covered already — but anything touching the CLI almost always edits
crates/wecode-cli/tests/cli.rs too, and leaving it out fails the scope check after the
work is done. Three tasks in a row have been caught by this.

Acceptance is an executable command, never a description. `Judged` is illegal on a
task and the gate will refuse it.
"""

[bug]
worktree  = true
assign_to = "impl"
accept    = ["cargo test --workspace"]
tokens    = 60000
wall_secs = 2700
guidance  = """
Reproduce first.

For a small bug, one task: the test and the fix together. "One cause per task" already
makes that atomic, and a ten-line fix does not need decomposing.

For a bug big enough to split, the main task is a container and the work goes in
ordered subtasks:

  main               the bug
   ├─ …-test         a test that fails today
   └─ …-fix          --after the test

Do not make the main task the fix and the test a subtask of it: that needs the parent
to depend on its own child, and there is no way to add a dependency after a task
exists anyway. Declare `--after` when you create the task.

Both go to `impl`, not `test`. In this repo tests live beside the code — 25 src files
carry inline `#[cfg(test)] mod tests`, and the integration suite is at
crates/wecode-cli/tests/cli.rs. The tester post's scope is tests/** and spec/**, so it
can write none of them; check with `wecode guard test write <path>`.

That means the usual guarantee — a tester that cannot weaken the code to make a test
pass — does not hold for this project. Rust's convention defeats it. Do not assign
test work to `test` here expecting it to be enforced; it will be refused at the
boundary.

One cause per task. Two symptoms with one cause is one task; one symptom with two
causes is two.

State the wrong behaviour in the title, not the intended fix — "audit seq restarts
at 1 per process", not "make seq monotonic". The fix is what acceptance proves.

If the cause is unclear, make a spike subtask first. A spike needs no write scope,
which is why it is the right shape for "find out why".
"""

[refactor]
worktree  = true
assign_to = "impl"
accept    = ["cargo test --workspace", "cargo clippy --all-targets -- -D warnings"]
tokens    = 90000
wall_secs = 3600
guidance  = """
Behaviour must not change, so the acceptance is the existing suite passing unchanged.

Do not put tests/** or any test module in the write scope. Needing to edit a test
means behaviour changed and this is a feature or a bug, not a refactor. That is the
whole distinction from a chore.

Renaming a public item is a refactor; changing what it returns is not.
"""

[chore]
worktree  = true
assign_to = "impl"
accept    = ["cargo test --workspace"]
tokens    = 40000
wall_secs = 1800
guidance  = """
Dependency bumps, config, tooling, gitignore. No behaviour change intended, but
unlike a refactor no claim is made about it either.

Keep these separate from feature work — a dependency bump inside a feature diff
hides both.
"""

[spike]
worktree  = false
assign_to = "impl"
accept    = ["test -f docs/theory.md"]
tokens    = 30000
wall_secs = 1800
guidance  = """
Answers a question; changes no code. Needs no write scope, which is the one
admission exemption any kind gets.

Say in the title what question is being answered, and put the answer in
docs/theory.md under the open questions — that file exists for exactly this and is
explicitly not required to implement anything.

Time-box it. A spike that turns into an implementation should have been a feature.
"""

[design]
worktree  = false
assign_to = "impl"
tokens    = 40000
wall_secs = 1800
# No default acceptance: it wants the task id in the path, and nothing substitutes one
# until `--expand` lands. Pass --accept-cmd "test -f docs/wecode/<task>/design.md".
guidance  = """
Proposes a change and writes no code. The deliverable is docs/wecode/<task>/design.md,
and it is the only kind that is not finished when it passes — it goes to needs-approval
and waits for a signature, because whether a design is right is exactly the part no
command can check.

Say what the change decides, what it costs, and what it makes harder. A design that
only lists benefits has not been thought about. Name anything in the tree that states
the opposite today, so reversing a decision is deliberate rather than accidental.
"""

[docs]
worktree  = false
assign_to = "impl"
accept    = ["test -f docs/README.md"]
tokens    = 30000
wall_secs = 1800
guidance  = """
Single task. No subtasks, no worktree — prose does not conflict the way code does,
so edit in place.

Every page describes what **exists**. Anything planned goes in plan.md; anything built
but weak goes in the gaps section of docs/features.md. Mixing the two is how the old
architecture.md became untrustworthy enough to delete.

The reasoning behind a change belongs in its commit message, where it stays true.
docs/design/decisions.md keeps only the arguments a reader still needs.
"""
