# The board, declared rather than drawn. A box that differs from the box beside it only in
# which rows it keeps is not a second component: five of the six things a box declares are
# data, and the sixth — the filter — has to resolve to a name the code knows.
#
# Rearranging, renaming or resizing the board is an edit to this file. A new filter is not.

# Seven boxes, and the order is the reading order: what wants you, what is moving, what is
# waiting its turn, what is stuck, what is not begun, what is finished but not landed, and
# what was put down. Down the page is away from you — the first box is the one thing nothing
# can do without a person, and the last is the one nobody has to look at again.
#
# It was four, and the fold was too greedy. `cooking` had stale, queued, failed and
# delivered in it, so a red failed row sat in the same list as ten green delivered ones and
# the box that is opened to ask *what has gone wrong* answered mostly with things that had
# gone right. Queued is waiting its turn and delivered is waiting to land: both are somebody's
# next move, not a fault, and neither belongs beside a task that ran out of attempts. The
# fold keeps the two panels that really are one question — see MACHINE_SIDE in core/board.ts.
#
# `open` comes off the page for the same reason: it mixed the epics and stories nobody has
# started with the ones in flight, which is two questions in one box. `planned` is the half
# that is a question — what to pick up — and the work in flight is read off `running` and
# the outline, where it is drawn under the tree it belongs to.
#
# `projects` is off the page too. It was the way back out to the whole workspace, and the
# outline (`t`) is that way now: it draws every project with its tree under it, which is
# more than a flat box of names ever did. A box costs the height it takes from the ones
# that answer a question.
page:
  order: [needs_human, running, queued, cooking, planned, delivered, dropped]

# Off the page, not gone. A box here is drawn by nothing on the dashboard and is still
# opened by `v` and its letter — the cost a box was cut for is the height it took from the
# boxes beside it, and a page it is not on costs none of that.
#
# `projects` is a flat list of every project, which is what the outline answers at more
# length. `open` is every epic and story still owed, begun or not — the box `planned` was
# split out of, kept whole for the one question it does answer well: what is left. Keeping
# both letters alive is the difference between moving a box and taking the door off.
off_page:
  open:
    title: Open
    filter: open
    key: o
    rows: 8
    empty: no epics or stories open
  projects:
    title: Projects
    filter: projects
    rows: 8
    empty: no projects — wecode project create --parent <workspace> <name>

# The services box is not one of the views: it is not a filter over the board, `v` does not
# open it, and its four rows are four different questions rather than one query's rows. What
# it still shares with a view is that none of the words in it belong in a .tsx file.
#
# `doctor` is the one row with no service behind it. Its version is the release the doctor
# is planned for — docs/design/19 — and when it ships, this is the line that changes.
services:
  title: Services
  busy_phases: [pending, running, waiting]
  doctor:
    version: 0.0.2
    state: not built
    detail: healing and collection

# Why a row is cooking. A row in flight is one of a few kinds of moving-or-stuck, and which
# kind it is, is the first thing a person asks of it — so the box says the why on every row,
# gathers the rows that share one, and marks them so a row read on its own still carries its
# group.
#
# The colours are here for the same reason the titles are: which states are alarming is a
# judgement about this workspace, not an arithmetic a list can do. This is the only place
# they are written; list.tsx reads them and holds none of its own.
#
# `groups` is drawn in the order given — what wants a person first, what is already done
# last. A state no group claims falls to `ungrouped`, where the why is the state's own word.
# Adding a state to a group, or a group to the box, is an edit to this file and nothing else.
cooking:
  groups:
    - name: gave_up
      why: gave up
      mark: "x"
      colour: red
      states: [failed, dropped]
    - name: waits_on_you
      why: waits on you
      mark: "!"
      colour: yellow
      states: [waiting, on_hold, blocked, pending]
    - name: in_hand
      why: a worker has it
      mark: ">"
      colour: ""
      states: [running, attempting]
    - name: settled
      why: nothing left to do
      mark: "+"
      colour: green
      states: [delivered, released, done, passed, met, accepted, succeeded]
  # No group claims it: nothing to say beyond the state itself, and no mark worth spending.
  ungrouped:
    mark: " "
    colour: ""

# The outline is the same tree the boxes filter, drawn whole. It is not a view: it has no
# filter, because it keeps every row there is and folds the ones you are not reading.
outline:
  title: Outline
  key: t
  # Folded to here when it opens: this level is shown, and what hangs under it is not.
  depth: story
  # How much of the tree it opens on — `open` is the work still owed, `all` is every row
  # there is. `f` moves between the two at runtime; this is the one the screen lands on,
  # and which that is is a decision about the product, not about the App.
  scope: open
  empty: no projects — wecode project create --parent <workspace> <name>
  # What the outline spends its width on, left to right. The tree is first: a guide drawn
  # after two columns of repeating words starts in the middle of the line, and a guide you
  # have to find the left edge of is one nobody follows down sixty rows.
  #
  # The tree cell is the guide and the fold marker only. The label is not a column — it
  # leads the prose after these, so a long name costs the line it is on and no other.
  columns: [tree, id, type, state]
  # Four columns each for the two words that repeat on every row. Four tells the kinds
  # apart (proj rele epic stor requ acce task) and the states too; wider than that spends
  # the label's width saying the same word again.
  abbreviate: 4
  # The words four of their own characters would not tell apart, or would mislead.
  abbreviations:
    requirement: requ
    criteria: crit
    acceptance_test: atst
    task_test: ttst
    in_progress: work
    not_started: nots
    on_hold: hold
    delivered: delv
    dropped: drop
    planned: plan
    released: rels
    accepted: acpt
    succeeded: succ

# The letters are declared rather than derived. Seven names do not have seven distinct
# first letters between them — delivered and dropped want the same one — and which letter
# a box answers to is the one thing about it an operator holds in their hands, so it is
# written down beside the title instead of falling out of the page's order.
views:
  needs_human:
    title: Needs you
    filter: needs_human
    key: n
    rows: 5
    empty: nothing waits on you
  # Who is holding what, right now. Short because a workspace has as many running rows as
  # it has workers.
  running:
    title: Running
    filter: running
    key: r
    rows: 6
    empty: nothing is running
  # Ready, with no slot yet. Out of the fold: a task waiting its turn has not gone wrong,
  # and reading it beside one that gave up said neither thing clearly.
  queued:
    title: Queue
    filter: queued
    key: q
    rows: 6
    empty: nothing is waiting for a slot
  # Only what is stuck — failed and stale, in one list, oldest first. What has stopped
  # moving is at the top of one box instead of somewhere in two.
  cooking:
    title: Cooking
    filter: cooking
    key: c
    rows: 10
    empty: nothing is stuck
  # Written down, not begun. The other half of what `open` used to hold; the half that is
  # in flight is read off Running and off the outline.
  planned:
    title: Planned
    filter: planned
    key: p
    rows: 8
    empty: nothing is planned
  # Done, and waiting on a landing. A move somebody still owes it, which is why it is a box
  # of its own and not a green tail on the end of the fold.
  delivered:
    title: Delivered
    filter: delivered
    key: d
    rows: 5
    empty: nothing is waiting to land
  # Put down on purpose, and last: it is the one box nobody has to look at again, so it
  # costs the least height and sits where the eye stops.
  dropped:
    title: Dropped
    filter: dropped
    key: x
    rows: 3
    empty: nothing has been dropped
