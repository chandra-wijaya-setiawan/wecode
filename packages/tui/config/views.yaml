# The board, declared rather than drawn. A box that differs from the box beside it only in
# which rows it keeps is not a second component: five of the six things a box declares are
# data, and the sixth — the filter — has to resolve to a name the code knows.
#
# Rearranging, renaming or resizing the board is an edit to this file. A new filter is not.

# Four boxes. Eight was eight places to look for the one row that has stopped moving, and
# four of those eight were the machine reporting on itself with nobody holding it — stale,
# queued, failed and delivered are one box, `cooking`, folded oldest-first by core/board.ts
# (see MACHINE_SIDE there). Oldest-first is the point of folding them: what has stopped
# moving is at the top of one list instead of somewhere in four.
#
# `running` is not one of them and has its own box again. A row in the fold is a row nobody
# is holding, read for how long it has sat; a running row is the opposite — a worker has it
# right now, and what is asked of it is who and how much, not how old. Folding the two
# together put the one box an operator watches while work is in flight at the bottom of a
# list sorted by staleness, which is the far end from where it was looked for.
#
# The other two are the second question the board asks a person — what waits on you — and
# the open epics and stories, which are not a report at all but the tree `enter` descends
# from. Neither is foldable; a folded row is off five tables and can no longer say which
# entity it is.
#
# `projects` is off the page. It was the way back out to the whole workspace, and the
# outline (`t`) is that way now: it draws every project with its tree under it, which is
# more than a flat box of names ever did. A box costs the height it takes from the three
# that answer a question.
page:
  order: [needs_human, open, running, cooking]

# Off the page, not gone. A box here is drawn by nothing on the dashboard and is still
# opened by `v` and its letter — the cost a box was cut for is the height it took from the
# boxes beside it, and a page it is not on costs none of that.
#
# `projects` is the one: a flat list of every project, which is what `v p` has always meant
# and what the outline answers at more length. Keeping the letter alive is the difference
# between moving a box and taking the door off.
off_page:
  projects:
    title: Projects
    filter: projects
    rows: 8
    empty: no projects — wecode project create --parent <workspace> <name>

# The services box is not one of the views: it is not a filter over the board, `v` does not
# open it, and its four rows are four different questions rather than one query's rows. What
# it still shares with a view is that none of the words in it belong in a .tsx file.
#
# `doctor` is the one row with no service behind it. Its version is the release the doctor
# is planned for — docs/design/19 — and when it ships, this is the line that changes.
services:
  title: Services
  busy_phases: [pending, running, waiting]
  doctor:
    version: 0.0.2
    state: not built
    detail: healing and collection

# Why a row is cooking. A row in flight is one of a few kinds of moving-or-stuck, and which
# kind it is, is the first thing a person asks of it — so the box says the why on every row,
# gathers the rows that share one, and marks them so a row read on its own still carries its
# group.
#
# The colours are here for the same reason the titles are: which states are alarming is a
# judgement about this workspace, not an arithmetic a list can do. This is the only place
# they are written; list.tsx reads them and holds none of its own.
#
# `groups` is drawn in the order given — what wants a person first, what is already done
# last. A state no group claims falls to `ungrouped`, where the why is the state's own word.
# Adding a state to a group, or a group to the box, is an edit to this file and nothing else.
cooking:
  groups:
    - name: gave_up
      why: gave up
      mark: "x"
      colour: red
      states: [failed, dropped]
    - name: waits_on_you
      why: waits on you
      mark: "!"
      colour: yellow
      states: [waiting, on_hold, blocked, pending]
    - name: in_hand
      why: a worker has it
      mark: ">"
      colour: ""
      states: [running, attempting]
    - name: settled
      why: nothing left to do
      mark: "+"
      colour: green
      states: [delivered, released, done, passed, met, accepted, succeeded]
  # No group claims it: nothing to say beyond the state itself, and no mark worth spending.
  ungrouped:
    mark: " "
    colour: ""

# The outline is the same tree the boxes filter, drawn whole. It is not a view: it has no
# filter, because it keeps every row there is and folds the ones you are not reading.
outline:
  title: Outline
  key: t
  # Folded to here when it opens: this level is shown, and what hangs under it is not.
  depth: story
  # How much of the tree it opens on — `open` is the work still owed, `all` is every row
  # there is. `f` moves between the two at runtime; this is the one the screen lands on,
  # and which that is is a decision about the product, not about the App.
  scope: open
  empty: no projects — wecode project create --parent <workspace> <name>
  # What the outline spends its width on, left to right. The tree is first: a guide drawn
  # after two columns of repeating words starts in the middle of the line, and a guide you
  # have to find the left edge of is one nobody follows down sixty rows.
  #
  # The tree cell is the guide and the fold marker only. The label is not a column — it
  # leads the prose after these, so a long name costs the line it is on and no other.
  columns: [tree, id, type, state]
  # Four columns each for the two words that repeat on every row. Four tells the kinds
  # apart (proj rele epic stor requ acce task) and the states too; wider than that spends
  # the label's width saying the same word again.
  abbreviate: 4
  # The words four of their own characters would not tell apart, or would mislead.
  abbreviations:
    requirement: requ
    criteria: crit
    acceptance_test: atst
    task_test: ttst
    in_progress: work
    not_started: nots
    on_hold: hold
    delivered: delv
    dropped: drop
    planned: plan
    released: rels
    accepted: acpt
    succeeded: succ

views:
  needs_human:
    title: Needs you
    filter: needs_human
    rows: 5
    empty: nothing waits on you
  open:
    title: Open
    filter: open
    rows: 8
    empty: no epics or stories open
  # Who is holding what, right now. Out of the fold and back on the page: this is the box
  # read while work is in flight, and it is short because a workspace has as many running
  # rows as it has workers.
  running:
    title: Running
    filter: running
    rows: 6
    empty: nothing is running
  # The four folded panels in one list, oldest first. It gets the height the four used to
  # share between them, because it is the whole of the machine's unheld side of the board.
  cooking:
    title: Cooking
    filter: cooking
    rows: 12
    empty: nothing is cooking
