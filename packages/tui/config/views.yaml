# The board, declared rather than drawn. A box that differs from the box beside it only in
# which rows it keeps is not a second component: five of the six things a box declares are
# data, and the sixth — the filter — has to resolve to a name the code knows.
#
# Rearranging, renaming or resizing the board is an edit to this file. A new filter is not.

page:
  order: [projects, running, needs_human, stale, queued, failed, open, delivered]

# The services box is not one of the views: it is not a filter over the board, `v` does not
# open it, and its four rows are four different questions rather than one query's rows. What
# it still shares with a view is that none of the words in it belong in a .tsx file.
#
# `doctor` is the one row with no service behind it. Its version is the release the doctor
# is planned for — docs/design/19 — and when it ships, this is the line that changes.
services:
  title: Services
  busy_phases: [pending, running, waiting]
  doctor:
    version: 0.0.2
    state: not built
    detail: healing and collection

# The outline is the same tree the boxes filter, drawn whole. It is not a view: it has no
# filter, because it keeps every row there is and folds the ones you are not reading.
outline:
  title: Outline
  key: t
  # Folded to here when it opens: this level is shown, and what hangs under it is not.
  depth: story
  empty: no projects — wecode project create --parent <workspace> <name>

views:
  projects:
    title: Projects
    filter: projects
    rows: 6
    empty: no projects — wecode project create --parent <workspace> <name>
  running:
    title: Running
    filter: running
    rows: 5
    empty: nothing is running
  needs_human:
    title: Needs you
    filter: needs_human
    rows: 5
    empty: nothing waits on you
  stale:
    title: Stale
    filter: stale
    rows: 6
    empty: nothing has been sitting
  queued:
    title: Queue
    filter: queued
    rows: 5
    empty: nothing is waiting for a slot
  failed:
    title: Failed
    filter: failed
    rows: 5
    empty: nothing has given up
  open:
    title: Open
    filter: open
    rows: 8
    empty: no epics or stories open
  delivered:
    title: Delivered
    filter: delivered
    rows: 5
    empty: nothing delivered yet
