# The cockpit's design, declared rather than drawn.
#
# views.yaml says which boxes there are and what each is called. This file says what the
# frame around them looks like: what chrome a section gets, how a head is written, where
# the bars sit, and which keys the bar names. Those were decisions argued out in docstrings
# inside screens.tsx, where the only way to ask what the cockpit is supposed to look like
# was to read the code that draws it — so a drawn frame could not disagree with the design,
# because there was no design to disagree with.
#
# test/the-cockpit-matches-its-design.test.ts gates the rendered frame against this file.
# Changing how the cockpit looks is an edit here first, and a red test until the drawing
# follows.
#
# The keys below `proposal` are the screen the operator signed off. Some keys outside it
# were written the other way round — by reading screens.tsx — and so gated nothing the code
# could fail. Where the two disagreed the proposal won, and the drawn key was retired as
# the board reached it: `head:` is the first to go, because the board now writes a head the
# way the proposal does. A design is what the screen must become, never a transcript of
# what it already draws.
#
# ── The split ────────────────────────────────────────────────────────────────────────────
#
# One design, two renderers. The tree `views.ts` builds out of this file is read twice: by
# the ink gate, which holds the terminal to it, and by the SVG projector, which draws a
# picture of it for someone to sign. A file that does not say which of its statements each
# renderer is answerable for makes the two renderers argue — the projector is held to a
# rule character it cannot draw, or the terminal is excused a decision that was never
# about characters at all.
#
# So the file is in two halves and an index:
#
#   renderers:  what one renderer draws and the other does not. A `─` filled to the width,
#               a border spent on a page, which line the bar is pinned to — these are a
#               terminal's way of saying "box", and an SVG says it with a rectangle.
#   shared:     what the screen *is*, which both renderers are given unchanged: which
#               sections there are, what a record's page holds, what a row of the tree
#               says, which keys the screen answers, and the proposal that was signed.
#   (the tail): the top-level names the gate's tests still read. Aliases, not copies —
#               every block below is defined exactly once, in the half it belongs to, and
#               the tail points at that one definition. Deleting the tail is a rename in
#               the tests and nothing else.
#
# Nothing in this file repeats views.yaml. The section names, their order and their letters
# are read from there; `lead` is the one section that is not a box and so has no row there.

renderers:
  # The terminal. Everything here is a decision about characters, lines and columns, and
  # every one of them is void on a renderer that has shapes instead.
  terminal:
    # A dashboard section is a rule with its name in it. A border would cost two lines and
    # two columns to make the same separation: eight sections at two lines is sixteen —
    # more height than the Cooking box is allowed to draw — and the columns come off every
    # row on the page. So the chrome is one line, the name sits in the rule rather than
    # above it, and every row starts at the terminal's left edge.
    dashboard: &dashboard
      chrome: rule
      chrome_lines_per_section: 1
      rows_begin_at_column: 0
      # What a row spends its first two columns on is its own state's mark from views.yaml
      # — the same vocabulary the heads are marked in — and not chrome. A state no group
      # claims marks with a space, which is why a row can read as indented and is not.
      row_leads_with: mark
      # What a box is made of. The rule keeps `─`, which is why it is not here: what a box
      # costs is these two lines and these two columns.
      forbidden: ["┌", "┐", "└", "┘", "│", "├", "┤"]

    # How a head is written is not here. It was, as `head:` — a rule opened with `── `,
    # the name in capitals, the letter in brackets and the count held at the width by the
    # fill — and every line of it was a transcript of what screens.tsx already drew. The
    # proposal the operator signed writes a head differently, the board now draws it that
    # way, and a retired key kept beside the live one is a second answer to what a head is.
    # So there is one: `shared.proposal.head`, which both renderers read.

    # A screen given the whole terminal for one thing keeps its border: two lines once is
    # not sixteen, and the border is what tells that page from the bars under it.
    pages: &pages
      chrome: border
      bordered: [box, outline, node, assignment]

    # The last line is the bar, and the one line the App has to say anything on sits
    # directly above it. Both always have to be readable, which is why the body states its
    # height rather than flexing into whatever is left. A terminal has a last line; a
    # picture has a bottom edge and no notion of which line is final, which is why this is
    # here and not in the half both renderers read.
    bars: &bars
      key_bar: last
      status: above_key_bar

  # The browser. The third renderer of the same tree, and the one a person reaches without
  # a terminal. A document is not a grid of cells: it has no last line to pin a bar to, no
  # width to fill a rule to and no column a row begins at, so every statement the terminal
  # half makes is answered here rather than inherited.
  #
  # What this block is for is the shell — the frame every page of the web surface wears,
  # declared once here instead of written out again in each page's template string. A
  # second page that spelled its own `<!doctype>` would be a second answer to what the web
  # surface looks like, and the two would drift on the first rename.
  # packages/webapp/test/the-shell-matches-its-design.test.ts gates the served document
  # against these words, and holds every page in `src/pages` to going through the shell.
  webapp:
    chrome: document
    # A browser draws boxes out of shapes, as the projector does; nothing here is spelled
    # with a character the terminal half forbids.
    glyphs: none
    shell:
      doctype: "<!doctype html>"
      lang: en
      charset: utf-8
      viewport: "width=device-width, initial-scale=1"
      # What the tab says, and what the page says at the top of itself. The same word: the
      # product has one name, and a banner that disagreed with the title would be two.
      title: wecode
      banner: wecode
      # One element holds the whole page. A page's own markup goes inside it and nowhere
      # else, which is what makes "is this page in the shell" a thing a test can ask.
      body: main
      # In the document, not beside it: the surface is one workspace's own board on one
      # workspace's own machine, and a second request for a stylesheet buys nothing.
      stylesheet: inline
    # What the banner carries under the word: every page of the surface, in the order a
    # reader meets them. Which page comes first is a decision about the surface and not
    # about any one page, so it is said here once rather than in five files that would each
    # have to agree — and it is said in the design, beside the frame the banner is part of,
    # because an order nobody can read off the design is an order nobody signed.
    #
    # `page` is the file in `src/pages`, not a path: where a page answers is `discover.ts`'s
    # one answer (the board answers at `/`, everything else at its own name) and repeating
    # it here would be a second one. `says` is what the reader is offered, which is not the
    # filename — a filename is for the machine.
    #
    # Every discovered page is here and nothing else is: a page missing from the order is a
    # page with no way in, which is the same failure as a page with no file, and
    # `every-page-opens-with-the-banner.test.ts` holds the list to the directory.
    banner:
      order:
        # The board first, because it is what the surface opens on.
        - page: board
          says: Board
        - page: projects
          says: Projects
        - page: tasks
          says: Tasks
        - page: decisions
          says: Decisions
        - page: tree
          says: Tree
        # The three that read the board sideways — who is working, what is stuck, what it
        # all cost — after the four that read the record.
        - page: agents
          says: Agents
        - page: cooking
          says: In flight
        - page: ledger
          says: Ledger
        # Last, because it is the one page that is not about work: a sketch is a drawing made
        # before there is any, and a reader goes looking for it rather than meeting it.
        - page: sketches
          says: Sketches
    # A section of the page is separated by a rule, as it is in the terminal — but the rule
    # is a border on the element, not a row of characters spent out of the height.
    sections:
      chrome: rule
      drawn_with: border
    # The look. What the terminal half spends on characters and columns, a browser spends on
    # colour, type and space, and those are decisions about the surface exactly as `chrome:
    # rule` is. They used to be five template strings, one per page, each with its own
    # `#888` in it: five answers to what "faint" is, which agree until one page is restyled.
    #
    # So the look is here, once, and `shell.ts` is the only thing that turns it into a
    # stylesheet. The palette and the type are named, every rule spends them by name, and a
    # colour is changed in one row rather than grepped for across the pages.
    #
    # `roots` is what keeps one page's rules off another's markup: the whole sheet is in
    # every document, so each page's block is scoped to a shape only that page draws, and
    # `the-shell-is-the-signed-design.test.ts` holds every selector to its page's roots.
    look:
      # Every value below is the signed mockup's own. The look used to be a dark surface in
      # one typeface, which nobody signed — it was what the five pages happened to spell.
      # The mockup is a light paper surface set in three faces, and this is it: the palette
      # is its `:root`, colour for colour, and the type is its three families.
      #
      # A browser is told which way round the surface is so its own chrome agrees with it.
      scheme: light
      # The colours, by what they are for, holding the mockup's values. Nothing below spells
      # one out. A colour the mockup has and no rule spends is not listed: a token nothing
      # names is a decision nobody made.
      palette:
        page: "#f8f7f3"
        raised: "#fdfcfa"
        rule: "#e5e2d9"
        ink: "#1f2328"
        faint: "#6b7178"
        mark: "#2f6f77"
        good: "#3d6b4f"
      # Three faces, as the mockup is set: a serif for what is read, a sans for the surface
      # itself, and a mono for what must line up — an id, a code, a count.
      #
      # Each is a stack ending in one the machine already has. The mockup pulls the first of
      # each from a font service; this surface is one workspace's own board on its own
      # machine, and a document that waits on the network to draw is a worse document than
      # one set in Georgia.
      type:
        serif: '"Newsreader", Georgia, "Times New Roman", serif'
        sans: '"Source Sans 3", "Segoe UI", system-ui, sans-serif'
        mono: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace'
        size: "15px"
        leading: "1.6"
        tracking: ".12em"
      # The shape each page draws that no other page does. A page's rules may name nothing
      # outside these.
      roots:
        board: ["section.board"]
        decisions: ["article"]
        tree: ["ul.tree"]
        tasks: ["section.tasks", "div.inbox", "ul.inbox", "section.detail"]
        projects: ["main > h2", "ul.strip", "ul.cards"]
        agents: ["section.agents"]
        cooking: ["section.cooking"]
        ledger: ["section.ledger"]
        sketches: ["section.sketches"]
      # The document itself — its margins, its type, its banner, and the one line every page
      # says when it has nothing to show.
      frame:
        body: "margin: 0; padding: 1.75rem clamp(1rem, 4vw, 3rem); background: var(--page); color: var(--ink); font: var(--size)/var(--leading) var(--sans); font-variant-numeric: tabular-nums"
        main: "display: grid; gap: 1.5rem; max-width: 74rem; margin: 0 auto"
        h1: "font-family: var(--serif); font-size: 1.6rem; font-weight: 500; letter-spacing: -.01em; margin: 0; color: var(--ink)"
        # The banner's way in to every page: one row of names under the word, ruled off
        # from the page the way the mockup rules it off. It is the frame's and not any
        # page's, because it is the same row in every document.
        nav: "display: flex; flex-wrap: wrap; gap: 0 1.5rem; margin: -1rem 0 0; border-bottom: 1px solid var(--rule)"
        "nav a": "color: var(--faint); text-decoration: none; font-weight: 600; padding: .5rem 0; border-bottom: 2px solid transparent; margin-bottom: -1px"
        "nav a:hover": "color: var(--ink); border-bottom-color: var(--mark)"
        "p.empty": "margin: 0; color: var(--faint)"
        # The terminal dock, which the banner's last control opens. It is in every document
        # and belongs to no page, so it is the frame's — as the banner's row is.
        #
        # It is a sidebar: a column down the right edge, full height, with the page taking
        # the width that is left. It was a popover, which is the browser's own top-layer
        # box — drawn over the page rather than beside it, and shut by every link a reader
        # follows, because the top layer belongs to the document and a navigation is a new
        # one. So the open-or-shut state is a class the root wears, which a browser
        # remembers across a navigation, and these three rows are what it means.
        #
        # `position: fixed` and `inset: 0 0 0 auto` pin it to that edge with no regard for
        # where in the document it is drawn; `height` says the full window, which an inset
        # alone does not buy on a box the browser would otherwise size to its contents; and
        # `margin`, `padding` and `border` are spelled out because each is something the
        # browser would otherwise choose.
        #
        # A third of the window, which is about the mockup's proportion, and never narrower
        # than a line of output worth reading — a terminal that wraps at forty columns tells
        # the reader less than no terminal. On a window too narrow for even that, the floor
        # gives way rather than hanging the dock off the side.
        #
        # `display: none` is the shut state, because shut is what every document is served
        # in: the class is put on by the script at the foot, so a dock drawn open would
        # stand open for the length of a page load on every page of the surface.
        "#terminal": "position: fixed; inset: 0 0 0 auto; width: min(100vw, max(33vw, 32rem)); height: 100dvh; margin: 0; padding: 0; border: 0; border-left: 1px solid var(--rule); background: var(--raised); color: var(--ink); overflow: hidden; display: none"
        "html.docked #terminal": "display: flex; flex-direction: column"
        # …and the page gets the rest of the width. The dock is `position: fixed`, so it is
        # out of the flow and nothing makes room for it on its own: the room is this row,
        # which is the dock's width and the gutter the body already keeps on that side, so
        # the page is neither under the panel nor flush against it. Two rows saying one
        # width is two chances to drift, and `the-banner-opens-a-terminal.test.ts` holds
        # them to each other — a token would be the other answer, but the look's tokens are
        # the palette's and the type's and a width is neither.
        "html.docked body": "padding-right: calc(min(100vw, max(33vw, 32rem)) + clamp(1rem, 4vw, 3rem))"
        # The way back out, at the top, where a reader looks for it. Quiet: it is the one
        # control on a panel whose content is the point. It is stretched across the panel so
        # that the rule along its foot is the whole width of one — the line that used to be
        # the screen's own top border, moved onto the chrome, for the reason below.
        "#terminal button": "align-self: stretch; text-align: right; flex: 0 0 auto; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: .55rem .9rem; color: var(--faint); font: inherit; font-family: var(--mono); font-size: .92em; cursor: pointer"
        "#terminal button:hover": "color: var(--ink)"
        # The screen fills everything between the two, and it is a terminal's box rather than
        # a transcript's.
        #
        # Those are different things to declare. A transcript is text the browser lays out:
        # it wraps where the panel ends, it scrolls itself, and it is read in whatever
        # leading the document sets. A terminal lays itself out — the emulator is told how
        # many cells it has and draws exactly that grid, with its own viewport and its own
        # scrollback inside — so every one of those declarations is the document answering a
        # question the emulator has already answered, and answering it differently:
        # `white-space: pre-wrap` wraps rows the emulator wrapped itself, `overflow: auto`
        # is a second scroller around the one the emulator brought, and a leading of the
        # document's is a cell of a height the emulator did not choose.
        #
        # So what is left is the box and nothing in it: room to grow, a floor of nothing so
        # a flex child may actually shrink, the padding the design wants around the cells,
        # and `overflow: hidden` because anything the grid does not cover is the panel's
        # ground and not somewhere to scroll to. The rules that used to be drawn across it
        # are on the chrome above now, because the pane's box is what the fit divides into
        # cells — a border is two pixels of the reader's screen that the emulator is told it
        # has and does not.
        #
        # And it reaches the foot, because there is nothing under it any more. There was a
        # line along the bottom the next word was typed on — a form, a label and a text input
        # — and the four rules that drew it are gone with the markup. A terminal is typed
        # into at the screen: the reader clicks the black box and the keys go up from there,
        # so a second box below it was a second answer to where the next word went. The room
        # it took is the screen's now, which is more cells for the far end to draw in.
        "#terminal pre": "flex: 1 1 auto; min-height: 0; min-width: 0; margin: 0; padding: .9rem; overflow: hidden; color: var(--ink); font-family: var(--mono); font-size: .92em"
      # One block per page, in the order the sheet writes them.
      pages:
        board:
          "section.board": "border-top: 2px solid var(--rule); padding-top: .6rem"
          "section.board h2": "font-family: var(--serif); font-size: 1.25rem; font-weight: 500; letter-spacing: -.01em; margin: 0 0 .4rem"
          "section.board h2 .mark": "display: inline-block; width: 1.25rem; color: var(--mark)"
          "section.board h2 kbd": "float: right; color: var(--faint); font-family: var(--mono); font-size: .92em"
          "section.board ul": "list-style: none; margin: 0; padding: 0"
          "section.board li": "display: flex; gap: .75rem; padding: .1rem 0"
          "section.board li .code": "flex: 0 0 9rem; color: var(--faint); font-family: var(--mono); font-size: .92em"
          "section.board li .state": "flex: 0 0 9rem; color: var(--mark); font-weight: 600"
          "section.board li .what": "flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere"
        decisions:
          "article": "background: var(--raised); border: 1px solid var(--rule); border-left: 3px solid var(--mark); border-radius: 4px; padding: .8rem 1.25rem"
          "article h2": "font-family: var(--serif); font-size: 1.25rem; font-weight: 500; margin: 0 0 .5rem; overflow-wrap: anywhere; white-space: pre-wrap"
          "article h2 .id": "color: var(--faint); font-family: var(--mono); font-size: .8em; margin-right: .6rem"
          "article dl": "display: grid; grid-template-columns: 6rem 1fr; gap: .2rem .75rem; margin: 0"
          "article dt": "color: var(--faint); font-size: .85em; text-transform: uppercase; letter-spacing: var(--tracking)"
          "article dd": "margin: 0; min-width: 0; overflow-wrap: anywhere"
          "article dd ul": "list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem"
          "article dd li": "border: 1px solid var(--rule); border-radius: 3px; padding: 0 .4rem; color: var(--mark); font-family: var(--mono); font-size: .92em"
          "article dd.open": "color: var(--faint)"
          # The card takes the answer. The form is the one place on this surface a person
          # says something back, so it is drawn as a row of choices with the send beside
          # them rather than as a panel — a card is still the unit, and the verb belongs to
          # the question it settles.
          "article form.answer": "display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; margin: .8rem 0 0; padding-top: .7rem; border-top: 1px solid var(--rule)"
          "article form.answer ul.choices": "list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem"
          "article form.answer ul.choices li": "min-width: 0"
          # An option is a chip that is picked, and it is the same chip the answers row
          # draws, so the two readings of one option look like one option.
          "article form.answer ul.choices label": "display: flex; align-items: baseline; gap: .35rem; border: 1px solid var(--rule); border-radius: 3px; padding: .1rem .5rem; color: var(--mark); font-family: var(--mono); font-size: .92em; cursor: pointer"
          "article form.answer ul.choices label:hover": "background: var(--page)"
          "article form.answer ul.choices label:focus-within": "border-color: var(--mark)"
          "article form.answer ul.choices label span": "overflow-wrap: anywhere"
          # The way past the list. Faint, because it is what a reader falls back to.
          "article form.answer label.note": "display: flex; align-items: baseline; gap: .4rem; flex: 1 1 12rem; min-width: 0"
          "article form.answer label.note span": "color: var(--faint); font-size: .75rem; text-transform: uppercase; letter-spacing: var(--tracking)"
          "article form.answer label.note input": "flex: 1 1 auto; min-width: 0; background: var(--page); border: 1px solid var(--rule); border-radius: 3px; padding: .2rem .45rem; color: var(--ink); font: inherit"
          "article form.answer label.note input:focus": "outline: none; border-color: var(--mark)"
          "article form.answer button": "border: 1px solid var(--mark); border-radius: 3px; background: var(--mark); padding: .25rem 1rem; color: var(--raised); font: inherit; font-weight: 600; cursor: pointer"
          "article form.answer button:hover": "background: var(--ink); border-color: var(--ink)"
          "article p.how": "margin: .6rem 0 0; color: var(--faint); font-family: var(--serif)"
        tree:
          "ul.tree": "list-style: none; margin: 0; padding: 0"
          "ul.tree ul": "list-style: none; margin: 0; padding-left: 1.25rem; border-left: 1px solid var(--rule)"
          "ul.tree li": "padding: .1rem 0; min-width: 0; overflow-wrap: anywhere"
          "ul.tree li .label": "color: var(--ink)"
          "ul.tree li .id, ul.tree li .kind, ul.tree li .rollup": "color: var(--faint); font-family: var(--mono); font-size: .92em"
          "ul.tree li .state": "color: var(--mark); font-weight: 600"
        tasks:
          # The page's own name and its filter, above the two columns. The heading is an h2
          # for the reason the projects page's is: the h1 is the shell's banner.
          "section.tasks": "display: grid; gap: .9rem"
          "section.tasks > h2": "font-family: var(--serif); font-size: 1.25rem; font-weight: 500; letter-spacing: -.01em; margin: 0; color: var(--ink)"
          # One row of chips, ruled off from the list the way the mockup rules a strip off.
          "section.tasks .filter": "display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: baseline; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: .55rem 0"
          "section.tasks .filter .says": "color: var(--faint); font-size: .75rem; text-transform: uppercase; letter-spacing: var(--tracking)"
          "section.tasks .filter .tag": "border: 1px solid var(--rule); border-radius: 3px; padding: 0 .45rem; color: var(--faint); font-family: var(--mono); font-size: .92em; text-decoration: none; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"
          "section.tasks .filter a.tag:hover": "color: var(--ink); background: var(--raised)"
          # The chip the target is holding, marked in the same colour a picked row is.
          "section.tasks .filter a.tag.on": "color: var(--ink); border-color: var(--mark); box-shadow: inset 0 -2px 0 var(--mark)"
          # An axis the record offers nothing to narrow on: drawn, and visibly not a link.
          "section.tasks .filter .tag.none": "border-style: dashed; opacity: .7"
          "div.inbox": "display: grid; grid-template-columns: minmax(0, 18rem) minmax(0, 1fr); gap: 1.25rem; align-items: start"
          # One column when there is not room for two: a list and a detail side by side on a
          # phone is two columns of nothing.
          "@media (max-width: 48rem)":
            "div.inbox": "grid-template-columns: minmax(0, 1fr)"
          "ul.inbox": "list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow-y: auto"
          "ul.inbox li": "min-width: 0"
          # A row is one line, which is the budget the definition gives `tasks.list.item`:
          # a row is what a task is noticed by, and the whole brief is the detail's. A long
          # label is clipped here rather than cut in the markup, so the row keeps the
          # record's own words and the reader gets the rest by picking it.
          "ul.inbox a": "display: flex; gap: .5rem; align-items: baseline; padding: .35rem .4rem; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); box-shadow: inset 0 0 0 transparent; white-space: nowrap; overflow: hidden"
          "ul.inbox .label": "flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis"
          "ul.inbox a:hover": "background: var(--raised)"
          "ul.inbox li.picked a": "box-shadow: inset 3px 0 0 var(--good); padding-left: .75rem; background: var(--raised)"
          "ul.inbox .id": "color: var(--faint); font-family: var(--mono); font-size: .92em"
          "ul.inbox .state": "color: var(--mark); font-weight: 600; margin-left: auto"
          "section.detail": "background: var(--raised); border: 1px solid var(--rule); border-radius: 4px; padding: .8rem 1.25rem; min-width: 0"
          "section.detail h2": "font-family: var(--serif); font-size: 1.25rem; font-weight: 500; margin: 0 0 .5rem; overflow-wrap: anywhere"
          "section.detail h2 .id": "color: var(--faint); font-family: var(--mono); font-size: .8em; margin-right: .6rem"
          "section.detail dl": "display: grid; grid-template-columns: 6rem 1fr; gap: .2rem .75rem; margin: 0"
          "section.detail dt": "color: var(--faint); font-size: .85em; text-transform: uppercase; letter-spacing: var(--tracking)"
          "section.detail dd": "margin: 0; min-width: 0; overflow-wrap: anywhere"
          "section.detail dd.none": "color: var(--faint)"
          "section.detail dd ul": "list-style: none; margin: 0; padding: 0"
          "section.detail dd .state": "color: var(--mark); font-weight: 600"
        projects:
          # The page's own heading is an h2 directly in the document's one element: the h1 is
          # the shell's banner, and this page is the long form of one box of the board.
          "main > h2": "font-family: var(--serif); font-size: 1.25rem; font-weight: 500; letter-spacing: -.01em; margin: 0; color: var(--ink)"
          "ul.strip": "list-style: none; margin: 0; display: flex; flex-wrap: wrap; gap: .75rem 2.5rem; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: .9rem 0"
          "ul.strip li": "display: flex; gap: .4rem; align-items: baseline"
          "ul.strip .mark": "color: var(--mark)"
          # The strip is the mockup's: the number large in the serif, and what it counts
          # underneath it in small capitals.
          "ul.strip .title": "color: var(--faint); font-size: .75rem; text-transform: uppercase; letter-spacing: var(--tracking)"
          "ul.strip .count": "color: var(--ink); font-family: var(--serif); font-size: 1.75rem; line-height: 1.1"
          "ul.strip li.none .count, ul.strip li.none .title": "color: var(--faint); opacity: .6"
          "ul.cards": "list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr))"
          "ul.cards li": "background: var(--raised); border: 1px solid var(--rule); border-radius: 4px; padding: .8rem 1.25rem; display: grid; gap: .3rem; min-width: 0"
          "ul.cards .name": "font-family: var(--serif); font-size: 1.1rem; font-weight: 500; overflow-wrap: anywhere"
          "ul.cards .code": "color: var(--faint); font-family: var(--mono); font-size: .92em"
          "ul.cards .state": "color: var(--mark); font-weight: 600"
          "ul.cards .stories": "color: var(--faint)"
          "ul.cards .meter": "height: .3rem; background: var(--rule); border-radius: .15rem; overflow: hidden"
          "ul.cards .meter span": "display: block; height: 100%; background: var(--good)"
          "ul.cards .pulse": "color: var(--faint); display: flex; gap: .5rem; min-width: 0"
          "ul.cards .pulse .spark": "color: var(--good); letter-spacing: .05em"
        agents:
          # One card per worker, its seats hanging under it. The card is the projects
          # page's card, because it is the same thing — a thing with a name, a state and a
          # list — and a second shape for it would be a second surface.
          "section.agents ul.agents": "list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr))"
          "section.agents ul.agents > li.worker": "background: var(--raised); border: 1px solid var(--rule); border-radius: 4px; padding: .8rem 1.25rem; display: grid; grid-template-columns: 1fr auto auto; gap: .2rem .75rem; align-items: baseline; min-width: 0"
          "section.agents ul.agents > li.worker > span.name": "font-family: var(--serif); font-size: 1.1rem; font-weight: 500; overflow-wrap: anywhere"
          "section.agents ul.agents > li.worker > span.seats": "color: var(--faint)"
          "section.agents ul.agents > li.worker > span.cost": "color: var(--mark); font-family: var(--mono); font-size: .92em; font-weight: 600"
          "section.agents ul.agents > li.worker > span.age": "color: var(--faint); font-family: var(--mono); font-size: .92em"
          "section.agents ul.agents ul.seats": "grid-column: 1 / -1; list-style: none; margin: .3rem 0 0; padding: 0; border-top: 1px solid var(--rule)"
          "section.agents ul.agents ul.seats li": "display: flex; flex-wrap: wrap; gap: .1rem .6rem; padding: .15rem 0; min-width: 0"
          "section.agents ul.agents ul.seats li .id, section.agents ul.agents ul.seats li .age, section.agents ul.agents ul.seats li .cost, section.agents ul.agents ul.seats li .model, section.agents ul.agents ul.seats li .effort, section.agents ul.agents ul.seats li .harness": "color: var(--faint); font-family: var(--mono); font-size: .92em"
          "section.agents ul.agents ul.seats li .what": "flex: 1 1 8rem; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; text-overflow: ellipsis"
          "section.agents ul.agents ul.seats li .phase": "color: var(--mark); font-weight: 600"
        cooking:
          # A group per why. The one group that is not a refusal is marked in the good
          # colour, so the page reads as *these are moving, these are not* at a glance.
          "section.cooking": "border-top: 2px solid var(--rule); padding-top: .6rem"
          "section.cooking h2": "font-family: var(--serif); font-size: 1.25rem; font-weight: 500; letter-spacing: -.01em; margin: 0 0 .4rem; display: flex; gap: .5rem; align-items: baseline"
          "section.cooking h2 .mark": "color: var(--mark)"
          "section.cooking h2 .count": "margin-left: auto; color: var(--faint); font-family: var(--mono); font-size: .8em"
          "section.cooking.moving h2 .mark": "color: var(--good)"
          "section.cooking ul": "list-style: none; margin: 0; padding: 0"
          "section.cooking li": "display: flex; flex-wrap: wrap; gap: .1rem .75rem; padding: .1rem 0; min-width: 0"
          "section.cooking li .code": "flex: 0 0 9rem; color: var(--faint); font-family: var(--mono); font-size: .92em"
          "section.cooking li .state": "flex: 0 0 9rem; color: var(--mark); font-weight: 600"
          "section.cooking li .what": "flex: 1 1 12rem; min-width: 0; overflow-wrap: anywhere"
          # The why is on every row and the heading says it too, so on a row it is quiet.
          "section.cooking li .why": "color: var(--faint); font-size: .85em"
          "section.cooking.moving li .state": "color: var(--good)"
        ledger:
          # Three sections, read top to bottom: what it bought, what it is taking, what
          # bought nothing. The last is not coloured as an alarm — the page names the
          # failures so they can be read, not so they can be winced at.
          "section.ledger": "border-top: 2px solid var(--rule); padding-top: .6rem"
          "section.ledger h2": "font-family: var(--serif); font-size: 1.25rem; font-weight: 500; letter-spacing: -.01em; margin: 0 0 .4rem"
          "section.ledger p.total": "margin: 0 0 .5rem; color: var(--faint); display: flex; flex-wrap: wrap; gap: .5rem"
          "section.ledger p.total .apiece": "margin-left: auto; font-family: var(--mono); font-size: .92em"
          "section.ledger ol": "list-style: none; margin: 0; padding: 0"
          "section.ledger li": "display: flex; flex-wrap: wrap; gap: .1rem .75rem; padding: .1rem 0; min-width: 0"
          "section.ledger li .code": "flex: 0 0 9rem; color: var(--faint); font-family: var(--mono); font-size: .92em"
          "section.ledger li .what": "flex: 1 1 12rem; min-width: 0; overflow-wrap: anywhere"
          "section.ledger li .sum": "flex: 0 0 7rem; color: var(--mark); font-weight: 600"
          "section.ledger li .why": "flex: 1 1 100%; color: var(--faint); font-size: .85em; overflow-wrap: anywhere"
        sketches:
          # A list you scan, and above it one bar of what a tick lets you do. Every row is a
          # row and not a card, because the question a reader arrives with is "which of these
          # did I draw", which is answered by reading down a column.
          "section.sketches": "display: grid; gap: .9rem"
          "section.sketches > h2": "font-family: var(--serif); font-size: 1.25rem; font-weight: 500; letter-spacing: -.01em; margin: 0; color: var(--ink)"
          "section.sketches > p.q": "margin: 0; color: var(--faint); font-family: var(--serif)"
          # The bar, ruled off above the list the way the mockup rules a strip off. The count
          # of what is ticked pushes the buttons to the right, so the two acts sit together.
          "section.sketches .bar": "display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; border-top: 2px solid var(--rule); padding-top: .6rem"
          "section.sketches .bar .picked": "margin-right: auto; color: var(--faint); font-family: var(--mono); font-size: .9em"
          "section.sketches .bar button": "font: inherit; font-size: .92em; border: 1px solid var(--rule); border-radius: 3px; background: var(--raised); color: var(--ink); padding: .25rem .7rem; cursor: pointer"
          # The one act that makes something is the marked one. Removal is the plain button
          # beside it: the mockup draws it in a red the signed palette does not hold, and a
          # colour spelled here would be a colour nobody signed.
          "section.sketches .bar button.primary": "border-color: var(--mark); color: var(--mark); font-weight: 600"
          "section.sketches .bar button:hover": "background: var(--page)"
          # Nothing ticked is nothing to act on, and the bar says so rather than acting on
          # nothing: the script turns this off as soon as a tick goes on.
          "section.sketches .bar button:disabled": "color: var(--faint); border-color: var(--rule); background: var(--raised); cursor: default"
          "section.sketches .hint": "color: var(--faint); font-size: .9em"
          "section.sketches ul.sketches": "list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule)"
          # The columns the mockup lines up: the tick, the id, the name and what it says, the
          # kind, the state, when it was touched, and the way in.
          "section.sketches ul.sketches li": "display: grid; grid-template-columns: auto 3.5rem minmax(0, 1fr) 6rem 11rem 8rem auto; gap: .9rem; align-items: baseline; padding: .65rem .2rem; border-bottom: 1px solid var(--rule); min-width: 0"
          "section.sketches ul.sketches li:hover": "background: var(--raised)"
          "section.sketches ul.sketches li.head": "padding-bottom: .35rem; color: var(--faint); font-size: .85em; font-weight: 600; text-transform: uppercase; letter-spacing: var(--tracking)"
          "section.sketches ul.sketches li.head:hover": "background: none"
          "section.sketches input[type=checkbox]": "accent-color: var(--mark); width: .95rem; height: .95rem"
          "section.sketches .id": "color: var(--faint); font-family: var(--mono); font-size: .88em"
          "section.sketches .name": "font-weight: 600; overflow-wrap: anywhere"
          "section.sketches .name a": "color: var(--ink); text-decoration: none"
          "section.sketches .name a:hover": "color: var(--mark); text-decoration: underline"
          # What a sketch says of itself, cut to two lines. It is one line in the record, but
          # one line of somebody's prose is three of a column this narrow, and a list whose
          # rows are three deep is not a list you scan. Cut by the look and not in the markup,
          # so the row keeps the record's own words and a reader gets the rest by opening it.
          "section.sketches .name .says": "display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 400; color: var(--faint); font-size: .92em"
          "section.sketches .kind": "color: var(--mark); font-family: var(--mono); font-size: .88em"
          "section.sketches .state": "color: var(--faint); font-family: var(--mono); font-size: .88em"
          # A sketch that earned a story, which is the one thing the column is read for.
          "section.sketches .state.signed": "color: var(--good)"
          "section.sketches .when": "color: var(--faint); font-family: var(--mono); font-size: .88em"
          "section.sketches .row-acts a": "margin-left: .7rem; color: var(--faint); text-decoration: none; font-size: .9em"
          "section.sketches .row-acts a:hover": "color: var(--mark); text-decoration: underline"
          # …and the one that is open: the list gives way to it, so the drawing has the whole
          # width, with the way back above it where a reader looks for it.
          "section.sketches .open": "display: grid; gap: .5rem; border-top: 2px solid var(--rule); padding-top: .6rem"
          "section.sketches .open p.back a": "color: var(--faint); text-decoration: none; font-family: var(--mono); font-size: .9em"
          "section.sketches .open p.back a:hover": "color: var(--mark); text-decoration: underline"
          "section.sketches .open h3": "margin: 0; font-family: var(--serif); font-size: 1.25rem; font-weight: 500; overflow-wrap: anywhere"
          "section.sketches .open h3 .id": "margin-right: .6rem; font-size: .8em"
          "section.sketches .open p.says": "margin: 0; color: var(--faint); font-family: var(--serif); overflow-wrap: anywhere"
          "section.sketches .open p.meta": "display: flex; flex-wrap: wrap; gap: 1.2rem; margin: 0; min-width: 0"
          "section.sketches .open p.meta .mono": "color: var(--faint); font-family: var(--mono); font-size: .88em; overflow-wrap: anywhere"
          # The drawing itself, in a frame and at the width of the page. Tall, because a
          # sketch of a surface is a surface: a box the height of a thumbnail shows a reader
          # the top of it and asks them to guess the rest.
          "section.sketches .open iframe.drawing": "width: 100%; height: 80vh; border: 1px solid var(--rule); border-radius: 4px; background: var(--raised)"
          # A row whose file is not on this machine. The record holds the path and the
          # directory holds the picture, and the two can part company.
          "section.sketches .open p.gone": "margin: 0; padding: 2rem; border: 1px dashed var(--rule); border-radius: 4px; color: var(--faint); font-family: var(--mono); font-size: .9em; text-align: center; overflow-wrap: anywhere"
    # There is no bar. Every key the cockpit's bar names is a verb or a move, and the web
    # surface offers neither: it is read, and what changes wecode is the cli's.
    bars: none

  # The SVG projection of the same tree, which is how a design is shown to a person before
  # any of it is drawn in a terminal. It draws one rectangle per box and the box's own
  # name, and it draws nothing else — so every statement the terminal half makes is one it
  # cannot honour and is not asked to. A rule filled to the width is a line; capitals are a
  # way of making a head louder in a medium with one typeface; a bar pinned to the last
  # line is a box at the bottom. Saying so here is what stops a renderer being marked down
  # for declining to be a terminal.
  wireframe:
    chrome: outline
    draws: [box, title]
    glyphs: none
    fill: none
    case: as_written
    bars: as_boxes

shared:
  page: &page
    # Drawn above the boxes: a dead runner or an unreadable schema is the reason every box
    # under it is wrong, so it is read before the board and not after it.
    lead: services
    # The rest of the page, in order, is views.yaml `page.order`. It is not copied here.
    boxes: views.yaml#page.order

  # What a record's own screen looks like, declared beside the cockpit rather than left in
  # screens.tsx. The cockpit answers what is happening; a detail page answers what one
  # record is, and until now the only way to ask what it is supposed to show was to read
  # the code that shows it. Two screens are records — a node and an assignment — and they
  # share one block so the blocks line up with each other instead of each choosing its own
  # gutter.
  detail: &detail
    screens: [node, assignment]
    chrome: border
    # A page is named after its work and its state, never after its key: the reader who
    # pressed enter already knows the id, so a title of `task #3` spends its line saying
    # what they just typed. The assignment is the one record with no work of its own to be
    # named by, so it falls back to the id.
    title:
      node: "{what} · {state}"
      assignment: "assignment #{id} · {state}"
    # The block: `name  value`, names left-aligned into a gutter as wide as the longest of
    # them, and a value nobody wrote reading as a dash rather than as a gap.
    block:
      entry: "{name}  {value}"
      gutter: longest_name
      align: left
      empty: "—"
      # A page given the whole terminal wraps; a block sized to its own fields clips,
      # because it has no line to wrap onto. A wrapped value continues under the value,
      # never under the name.
      overflow:
        node: clip
        assignment: wrap
      wrap_under: value
    # What each record says about itself. Neither list restates the other's half: the board
    # already decided what a row is worth saying, and what the four columns had no room for
    # is the rest.
    fields:
      node: [entity, id, title, state, children]
      assignment: [entity, id, objective, state, budget, beat, worktree, detail]
    # A node is a branch, so its screen carries the list under it. An assignment is a leaf
    # and carries none.
    children:
      of: node
      title: "children ({count}) · {tally}"
      columns: ["#", what, state, detail]
      empty: "nothing under it"
    # The four rungs the outline stops short of. They are proof, not work: they say what a
    # story owes and what a task was accepted on, and the only moment that answer is wanted
    # is the moment someone is looking at that story or that task. So they are a second
    # section on the node page, under the children and read the same way — the page the row
    # already opens to, not a page of their own, because proof with its subject off-screen
    # is a statement about nothing.
    proof:
      of: node
      under: children
      # A story owes a requirement, which owes its criteria, which owe their tests; a task
      # is proven by its own tests. Both are one section, and the nesting is the same
      # indent the outline spends on depth rather than three titled sub-sections.
      entities:
        story: [requirement, acceptance_criteria, acceptance_test]
        task: [task_test]
      nesting: indent
      indent: 2
      title: "proof ({count}) · {tally}"
      columns: [mark, statement, state]
      empty: "nothing proves it yet"

    # A page drawing past its own border overwrites the two lines that must stay readable,
    # so what will not fit is dropped and counted rather than drawn.
    overrun: "… and {count} more"

    # The foot of a detail page is two lines, not one. The cockpit's bar is a flat list
    # because every key on it does the same thing wherever the cursor is; a record's page
    # answers two different questions at once — what can be done to this record, and how to
    # get back out — and a single line runs them together, so the key that acts on the
    # record sits between the key that leaves the page and the key that quits the program.
    # The two levels split them, and nothing else about the bar changes: same gap, same
    # entry.
    footer:
      lines: 2
      sits: last
      gap: "  "
      entry: "{key} {does}"
      # The global level is drawn last, on the terminal's final line, because that is where
      # it is on every other screen: a key whose position moves with the page is a key the
      # reader has to look for. The record level is the one that changes, so it is the one
      # that moves, and it sits above.
      order: [record, global]
      global_level: last_line
      levels:
        # What this page can do to the record it is showing, including moving the cursor
        # through the children it lists.
        - level: record
          keys: ["j/k", "g/G", enter, a]
        # What means the same thing on every screen, in the order the cockpit's bar already
        # names them.
        - level: global
          keys: [esc, v, "v t", r, q]
      # Neither level invents a key. Every key here is one `key_bar` already declares, and
      # a key `key_bar` withholds from this screen is withheld here too — the detail page
      # does not fold, so `+/-` appears on neither level.
      keys_from: key_bar
      omits: ["+/-"]

    # An approval is an assignment whose objective is a design, and the operator is being
    # asked to sign a picture. The page names the design and stops there, so the signature
    # is asked for with no way to look at what is being signed. It is the assignment page
    # with one line added — the path the mockup was written to — and that line is a path
    # because the operator opens the file in something that can draw an SVG.
    approval:
      of: assignment
      adds: [mockup]
      # Not a second rendering. A terminal cannot draw an SVG, and a text projection beside
      # the file would be a second answer to what the design looks like — the one the
      # operator signed would then be whichever they happened to read.
      projection: none
      projects_inline: false
      forbidden: [wireframe, svg, ascii, thumbnail]
      # One entry of the same block every other field is drawn in: no gutter of its own, no
      # alignment of its own, the path as its value. A design nobody has projected yet has
      # no path, and says so rather than offering a line that opens nothing.
      mockup:
        name: mockup
        value: path
        entry: "{name}  {path}"
        opens: file
        empty: "not projected yet"

  # The tree's own page, declared here for the same reason the detail page is: the cockpit
  # and a record both had a design and the outline had none, so what a row of the tree is
  # supposed to say was whatever outline.tsx happened to say it said — and what it says
  # today is the description first, with the id, the entity and the state buried behind
  # however long that description ran and the description itself cut at the right edge.
  #
  # A column is a shallow row paying the deepest row's width. Four of them — a tree cell, an
  # id, a kind and a state — spent the tree's whole width on every row, and bought a line
  # that is mostly blank; the kind and the state only fit their columns once they were cut
  # to four characters, which is the same cost again paid by the reader. So the row is one
  # string: the label leads because the label is what the row is, and its particulars follow
  # it in full words, joined by the separator the rest of the screen's prose already uses.
  # Nothing is padded, so a line is as long as it has something to say and no longer.
  outline: &outline
    chrome: border
    # What a row is made of. `order` is the order the one string is written in, not a set of
    # columns — there are none.
    row:
      as: sentence
      order: [marker, label, id, kind, state, rollup]
      entry: "{marker} {label} · #{id} · {kind} · {state} · {rollup}"
      leads_with: label
      join: " · "
      # A column is the thing this row is not. Nothing is padded to anything.
      columns: none
      pad: false
      # A row is a sentence, so it is not cut at the right edge: what will not fit continues
      # under where the label began. Three lines is where that stops — a row allowed to run
      # on is a row that can push the rest of the tree off the page — and the third line
      # ends in the elision rather than mid-word.
      overflow: wrap
      wrap_under: label
      truncate: false
      max_lines: 3
      elide: "…"
      # A part with nothing to say is dropped with its separator, never written empty.
      omit_empty: true

    # How far down the tree goes. The ledger is nine levels deep, and four of them are not
    # work at all — a requirement, its criteria, the tests that accept it and the tests a
    # task is proven by are the proof that a story was done, not things being done. Drawn as
    # rows they outnumber the work: one story with three requirements carries a dozen rows
    # under it before a single task appears, and the operator scrolling for what is moving
    # scrolls past all of them. So the tree stops at the five levels that are work, and the
    # proof is read on the page of the row it proves, where it is being asked for.
    levels:
      count: 5
      shows: [project, release, epic, story, task]
      # Not hidden behind a fold. A folded row still costs its line and still says there is
      # something under it; these are on another page entirely.
      omits: [requirement, acceptance_criteria, acceptance_test, task_test]
      omitted_to: detail
      fold_reaches: task
      # What the *web* tree does with those same four, which is not what a terminal can
      # afford to do with them. The cockpit's outline is one box of a screen that is a
      # fixed number of rows tall, so a proof row drawn there is a work row taken away; a
      # page in a browser is as long as it needs to be, and a row inside a shut fold costs
      # the reader nothing at all until they open it.
      #
      # So on the web the four are levels the tree shows: in the record's own order, under
      # the story they prove, each folding like the levels above it. They arrive folded
      # shut, so the page still lands at story level — a reader scrolling for what is
      # moving sees exactly what they saw before, and the reader asking what a story was
      # accepted on opens the story and finds it there rather than on another page.
      web:
        folds: [requirement, acceptance_criteria, acceptance_test, task_test]

    # Depth is the indent and nothing else. The rail said what the indent was already
    # saying, at two columns a level on every level above the row — at depth nine that is
    # eighteen columns of the label's width spent repeating the label's position.
    depth:
      as: indent
      every_row: true
      indent: 2
      # Sibling roots are separate trees rather than one branch, so a root is not indented.
      root: flush

    # The one mark a row carries, and it is carried only by the rows it says something
    # about: a row with children can be opened or closed, so it shows which of the two it is
    # and therefore what pressing the fold key does. A row with no children has nothing to
    # fold, so it is marked with nothing — a mark on every row would say only "this is a
    # row", which the row already says.
    marker:
      on: parents
      leads_row: true
      width: 1
      open: "-"
      closed: "+"
      leaf: " "
      says: fold_key

  # Every key the screen answers, in the order a reader scans them. A key the bar omits is a
  # way in nobody can find, so a key is dropped only where the screen refuses it: the
  # dashboard has nothing to pop, and only the outline folds. Which keys a screen answers is
  # the screen, not the drawing of it — a picture that left one out would be a picture of a
  # different product — so the list is shared and only the two strings that write it out on
  # a line of characters are the terminal's.
  key_bar: &key_bar
    gap: "  "
    entry: "{key} {does}"
    keys:
      - { key: "j/k", does: move }
      - { key: "g/G", does: top/end }
      - { key: "+/-", does: fold, only_on: [outline] }
      - { key: "enter", does: open }
      - { key: "esc", does: back, except_on: [dashboard] }
      - { key: "v", does: box }
      - { key: "v t", does: outline }
      - { key: "a", does: act }
      - { key: "r", does: refresh }
      - { key: "q", does: quit }

  # The signed-off screen. Every element the proposal shows is named here, so the board can
  # be gated against a picture the code did not write. It is shared because it is what was
  # signed: the operator put their name to the screen, not to one renderer's way of getting
  # there, and a proposal filed under a renderer would be a signature on a drawing.
  proposal: &proposal
    # One frame around the whole cockpit, and the two rails of that frame are the only
    # chrome that is allowed to hold anything: what workspace this is and whether the
    # machine is alive above, how to move below.
    frame:
      outer: border
      top_rail: [workspace, projects, beat]
      bottom_rail: [keys]
      top_rail_entry: "{workspace}  {projects} projects  beat {beat}"
      bottom_rail_entry: "{key} {does}"

    # One line per project, read before any section. It answers how fast the project is
    # moving and what is blocking it without opening anything.
    pulse:
      per: project
      line: "{tag} {name} {version}  {seats}  {throughput} {rate}  {flags} {crosses}"
      parts: [tag, name, version, seats, throughput, rate, flags, crosses]
      seats: { as: dots, held: "●", free: "○" }
      throughput: { as: sparkline, blocks: 10, glyphs: "▁▂▃▄▅▆▇█" }
      rate: "{done}/h"
      flags: { of: needs_you, mark: "⚑", key: n }
      crosses: { of: failed, mark: "✗", key: f }
      # A count carries the key that opens it, raised, so the number and the way in are one
      # token and neither costs a word.
      count: "{count}{key}"
      key_as: superscript

    # Each section's mark is its state in one glyph. A head opens with that glyph in column
    # zero — no dashes before it, none after — and pushes its count to the right edge.
    marks:
      needs_you: "⚑"
      running: "●"
      queue: "⧖"
      cooking: "✳"
      planned: "○"
      delivered: "✓"
      dropped: "✗"
    head:
      opens_with: mark
      begins_at_column: 0
      dashes: none
      case: upper
      line: "{mark} {title}"
      count_at: right
      count: "{count}{key}"
      key_as: superscript
      # The lead section is no filter over the board and `v` does not open it, so it is the
      # one head with neither a count nor a letter: it is the line and nothing else.
      countless: [services]
      # One box's count is a fraction, because its rows are not just rows: a running row is
      # holding one of the fleet's seats. `3` says how much is moving and nothing about
      # whether the machine is full — three of four seats is a workspace with nothing spare,
      # three of twenty is nineteen workers standing idle, and the operator's next move is
      # different in each. So the seated box's `{count}` is `held/seats`, and every other
      # box's is the plain number. A workspace with no workers has no seats to be short of
      # and falls back to the count.
      seated:
        box: running
        of: workers
        count: "{held}/{seats}"
      # The hint is on every head, not on the heads whose count happened to be worth
      # raising. A head with no letter on it is a section the operator can see and cannot
      # open, and which sections those are would then be decided by which ones had rows
      # that day.
      hint_on: every_head
      hint: "{key}"
      # Which letter is not decided here. views.yaml already gave each box one, and a second
      # copy of the seven letters is two lists that must agree with nothing checking them.
      # The proposal names two sections in shorter words than the board does, so what is
      # written here is which box each head is — the letter is read from there.
      keys:
        from: views.yaml#views.*.key
        sections:
          needs_you: needs_human
          running: running
          queue: queued
          cooking: cooking
          planned: planned
          delivered: delivered
          dropped: dropped

    # A row is a sentence, so it is not cut: what will not fit continues on the next line,
    # indented to where the text began and never under the mark. What it cost sits at the
    # end as a gauge, because a number alone does not say how near the end it is.
    row:
      leads_with: mark
      overflow: wrap
      wrap_under: text
      truncate: false
      spend:
        as: gauge
        blocks: 8
        glyphs: "█░"
        shows: [tokens, scope]
        entry: "{gauge} {tokens} {scope}"

    # Every section gets its own head. Queue and cooking used to share one line to save the
    # line, and what that line cost was the pair's two counts and two hints collapsed into
    # one: `q` and `c` open different boxes, and a head that names both sections can only
    # carry one of the letters, so half the pair was unopenable from the head that named it.
    # Waiting for a slot and being stuck are also two different questions, and a shared head
    # reads as one. A hint on every head is what a head is for, so no two sections share one.
    heads: per_section
    shared_heads: []

    # The foot of the board is the whole tree in one line: what is planned, what came out,
    # what was dropped, and the two ways in to all of it.
    tally:
      line: one
      entries: [planned, delivered, dropped, tree, all]
      entry: "{title} {count}{key}"
      key_as: superscript
      keys: { planned: p, delivered: d, dropped: x, tree: t, all: a }

# The names the gate's tests still reach a block by. Aliases of the one definition above,
# never a second copy of it: `page:` here and `shared.page` are the same node, so an edit to
# either is an edit to both and the two can never drift. They stay until the files that read
# them are in a scope that can rename them.
page: *page
detail: *detail
outline: *outline
key_bar: *key_bar
proposal: *proposal
dashboard: *dashboard
pages: *pages
bars: *bars
