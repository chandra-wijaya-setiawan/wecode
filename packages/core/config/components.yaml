# Which component owns which module — docs/design/01 §L2/§L3 as data.
#
# Exactly once is the whole point: every module under `packages/*/src` is claimed by one
# row here, and no module is claimed twice, so "which box does this code live in" has one
# answer and `components-cover-the-tree.test.ts` fails the moment it has none or two.
#
# A module is named without its extension, relative to its package's `src/`.
#
# Two rows are deliberately not components: `files` is docs/design/01's own "not
# components, and not at this level" row, and `surface` is a package's entry point, which
# owns nothing. They exist so the map can cover the tree without inventing a box the
# architecture does not have.

layers:
  gate: the domain and its application service — the part that is wecode rather than any backend
  presentation: queries, read models, listers. Nothing changes here at all
  data: the store, the migrations, the append-only ledger
  service: runs on a clock, and is a client of the core like any other
  client: how a person or an agent reaches a verb
  files: what the model and the ceiling are written in
  surface: an entry point — wiring, and nothing decided

components:
  engine:
    package: core
    layer: gate
    component: true
    owns: apply a verb, fire the cascade it unblocks, settle anything whose guard came true
    modules: [apply, approval, create, edit, bulk, cascade, chore, lease, lessons]

  model:
    package: core
    layer: gate
    component: true
    owns: the entities, their state machines as data, and one named guard per constrained transition
    modules: [types, entities, machines, guards, checks, invariants, land, facade, facade-gen]

  views:
    package: core
    layer: presentation
    component: true
    owns: the filters over the record, the walk down the tree, and what is next up
    modules: [board, tree, order, delivered]

  ledger:
    package: core
    layer: data
    component: true
    owns: one line per transition, appended inside the same transaction as the state change
    modules: [repo]

  store:
    package: core
    layer: data
    component: true
    owns: opening the database, the numbered migrations, transactions, and reading and writing rows
    modules: [store, db]

  files:
    package: core
    layer: files
    component: false
    owns: what is declared rather than coded — the roles, the stacks, the home, and reading a source file
    modules: [roles, stacks, home, ast]

  core surface:
    package: core
    layer: surface
    component: false
    owns: what a client of the library may import
    modules: [index]

  allocator:
    package: runner
    layer: service
    component: true
    owns: picks the next ready work, binds a worker, creates the assignment — within the attention budget, and under a scope resolved through the map when the task named a node rather than a path
    modules: [allocator, budget, scope]

  foreman:
    package: runner
    layer: service
    component: true
    owns: takes an assignment and makes it real — the session it runs in, what the last attempt left, and the words a chore's worker is dispatched with
    modules: [foreman, foreman/prompt, ports]

  trees:
    package: runner
    layer: service
    component: true
    owns: every branch and every worktree — cutting one, moving one, merging one into another, and taking one away. The only module in the runner that changes a ref or a checkout
    modules: [git]

  examiner:
    package: runner
    layer: service
    component: true
    owns: runs a test's artefact where the test belongs and records what came back
    modules: [examiner]

  synchroniser:
    package: runner
    layer: service
    component: true
    owns: writes what was observed back to the core, so the record and reality agree on every tick
    modules: [daemon, land-chore, premerge]

  worker adapter:
    package: runner
    layer: service
    component: true
    owns: one per kind of worker — the only thing that knows the difference — plus the preconditions every kind shares
    modules: [worker, adapters/claude-code, adapters/codex, adapters/pi, adapters/script, adapters/denials]

  doctor:
    package: runner
    layer: service
    component: true
    owns: checks wecode against itself, heals what it safely can, and proposes the rest as a chore
    modules: [doctor, doctor/trees, healer, ceiling, screens-check]

  heartbeat:
    package: runner
    layer: service
    component: true
    owns: saying the runner process is alive, on a clock of its own — so a long tick is never read as a dead runner
    modules: [heartbeat]

  runner surface:
    package: runner
    layer: surface
    component: false
    owns: the daemon's executable and what a client of the package may import
    modules: [bin, index]

  cli:
    package: cli
    layer: client
    component: true
    owns: every verb, as a command. The only way an agent reaches wecode
    modules: [bin, capabilities, delivered, doctor, explore, index, paint, plan, plan/refusals, run, scope-proposal, ui, unimported]

  repo-explorer:
    package: explorer
    layer: service
    component: true
    owns: the questions wecode asks about a repository — what a file defines and exports, what it imports, who references a symbol, the evidence of what a module is for, which files sit under a box of the architecture, and where the model of which node may reach which converges with, diverges from or is absent in the import graph, and what map that same import graph would propose if nobody had written one. The index behind it is an adapter, replaceable without a caller noticing
    modules: [adapters/codegraph, architecture, coverage, index, ports, propose, reflexion]

  view-index:
    package: lens
    layer: client
    component: true
    owns: the screens a person reads stated as ports — what the index of boxes must say, said once and without naming a renderer. The renderers behind it — ink for a terminal, CDP for a web page, wireframe for a picture — draw those lines and decide nothing
    modules: [adapters/cdp, adapters/ink, check, diff, expected, index, ports, wireframe]

  tui:
    package: tui
    layer: client
    component: true
    owns: the board, and the few verbs worth typing while looking at a row
    modules: [app, bin, index, list, outline, screens, services, views]

  webapp:
    package: webapp
    layer: client
    component: true
    owns: the same board in a browser — one page per question, drawn from the boxes views.yaml declares and wrapped in the shell design.yaml declares, served over http. It reads the record, and answers an approval in the operator's own name; that one verb is the exception, because every other verb that changes wecode is an agent's or the cli's
    modules: [answer, pages/agents, pages/board, pages/cooking, pages/decisions, pages/discover, pages/ledger, pages/projects, pages/shell, pages/tasks, pages/tree, server]

  painter:
    package: painter
    layer: client
    component: true
    owns: the surface a person reviews an artefact on — one session per artefact, the prompts the browser queues against it, the poll a waiting agent is woken by, and the chrome the artefact is framed in before it is served. It holds no opinion about what an artefact says
    modules: [frame, pty, server, session]

  painter overlay:
    package: painter
    layer: client
    component: true
    owns: what the reviewer sees and does in the browser — picking an element, queueing a prompt against it, the terminal the session is driven from, and the styling of the chrome around them. It runs in the page and decides nothing the server has not already offered
    modules: [client/overlay, client/overlay.css, client/pick, client/queue, client/terminal]

  painter surface:
    package: painter
    layer: surface
    component: false
    owns: what a client of the painter package may import
    modules: [index]

  webapp surface:
    package: webapp
    layer: surface
    component: false
    owns: the web server's executable and what a client of the package may import
    modules: [bin, index]
