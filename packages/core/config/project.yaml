# How long a file in this repository may be.
#
# A ceiling on every `.ts`/`.tsx` under `packages/*/src` and `packages/*/test`, and a
# ratchet for the files that were already over it the day the ceiling was set. Data rather
# than code: the number is a policy the people who own the tree change, not a constant in a
# module they would have to open.
#
# `ceiling` is what a file may be. `over` is the ratchet — one row per file that was
# already longer, recording exactly how long it was. A ratcheted file may shrink but never
# grow: shorten it and its row must come down with it, take it under the ceiling and its
# row goes away. Nothing may be added to `over`; a new file meets the ceiling.
#
# A row is a record of a length, not a licence: when work lands that breached a row anyway,
# the row is restated at what the file now is, so the next change is measured against the
# truth rather than against a number the tree stopped matching.
ceiling: 400

# How this repository is built, in sentences a worker can act on.
#
# Owned by the operator, not by any module: these are the things every fresh worktree
# rediscovers the hard way — that it starts without node_modules, that a commit needs an
# inline identity, which command builds before which tests. The foreman reads this list
# and hands it to the worker under its own heading, beside the lessons. A lesson is what
# one attempt learned; a convention is what the operator already knew and chose to say.
#
# One sentence per line. Keep the list short: a brief nobody finishes teaches nothing.
conventions:
  - A worktree starts without node_modules — run `pnpm install && pnpm -r build` before any test.
  - git has no user identity here — commit with `git -c user.name=... -c user.email=... commit`.
  - Build before you prove: `pnpm -r build`, then `pnpm exec vitest run <file>` for one test file.
  - Every `.ts`/`.tsx` under `packages/*/src` and `packages/*/test` has a line ceiling in packages/core/config/project.yaml.
