[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/local/wecode"

[workspace.dependencies]
wecode-core = { path = "crates/wecode-core" }
wecode-a2a = { path = "crates/wecode-a2a" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"
# The `as` casts that lose information, rather than all of pedantic. A budget read
# back as `-1 as u64` is a limit nothing can exhaust, which is the failure this
# family prevents; the rest of pedantic is style, and would bury it.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"

[profile.release]
lto = "thin"
strip = true
