# Raising max_open is the easiest change in this file and usually the wrong one.
max_open: 10

order:
  # Off until task 148 lands: with it on, allocate() re-orders by attempts while
  # allocateOne prepares by id, the two disagree, and nothing is dispatched.
  fresh_first: false
  oldest_first: true

collision:
  scope_overlap: refuse
