invariants:
  never_touch: [".github/**", "infra/**", "**/*.pem", "**/*.key", "**/.env"]
  never_run: ["git push --force*", "npm publish*", "terraform apply*", "rm -rf /*"]

defaults:
  budget: { tokens: 250000, seconds: 3600 }
  harness: claude-code

roles:
  engineer:
    worker_kind: agent
    scope:
      # `packages/*/sql/**` is the schema: a migration is source like any other module, and a
      # story that adds a column cannot be done without it. Pinned by
      # packages/core/test/ceilings-cover-the-schema.test.ts, which refuses any source
      # directory this list cannot reach.
      write:
        ["packages/*/src/**", "packages/*/test/**", "packages/*/config/**", "packages/*/sql/**", "src/**", "tests/**"]
      tools: ["bash", "read", "edit", "write"]

  # docs/design/18. The role a chore runs under, and the only one that may write anywhere:
  # a merge conflict is wherever the conflict is, so a scope that names files would refuse
  # the work it exists to do. That authority is exactly why a chore is a separate noun and
  # not a flag on a task — a task must never hold it.
  #
  # The two standing invariants above still bind it. `never_touch` and `never_run` are a
  # ceiling above the ceiling, not a scope, so `**` does not reach them.
  #
  # No worker holds this role yet. Until a system worker exists, a merge chore is created,
  # shown, and taken by nobody.
  system:
    worker_kind: agent
    scope:
      write: ["**"]
      tools: ["bash", "read", "edit", "write"]

  # The role the person at the keyboard holds. `OPERATOR` is the actor every unattributed
  # answer already carries — `actorOf(WECODE_ACTOR) ?? OPERATOR` in the TUI and the CLI — and
  # `answerApproval` refuses a name that is not a human worker row. Without this declaration
  # the default actor cannot be hired at all, so every approval answered from the cockpit is
  # refused with `"operator" is not a human worker`.
  #
  # A human role gets no flags, it gets a message: no tools, and nothing writable. An
  # operator's authority is over the record, not over the tree — a person who wants to edit
  # files does it as themselves, outside the workforce.
  operator:
    worker_kind: human
    scope:
      write: []
      tools: []

  acceptance-tester:
    worker_kind: agent
    scope:
      write: ["packages/*/test/**", "tests/acceptance/**"]
      tools: ["bash", "read", "edit", "write"]
    budget: { tokens: 120000, seconds: 1800 }
