stack: pnpm
# What makes a fresh worktree runnable. Every attempt is cut as a new worktree, which has no
# node_modules and no dist, so a suite run in one dies on its first import. The examiner runs
# this once per tree per tip, before it proves anything, which is why `test` no longer carries
# it: install and build are named here, once.
prepare: pnpm install && pnpm -r build
test: pnpm typecheck && pnpm exec vitest run
typecheck: pnpm typecheck
source:
  - src/**
  - packages/*/src/**
tests:
  - test/**
  - tests/**
  - packages/*/test/**
# Each package's outward surface: the modules whose exports the repository publishes instead
# of importing. Declared here rather than guessed from a filename, because which module is a
# package's entry point is a fact about the packaging. The tree half of the doctor exempts
# these files, and every name they publish, from the unimported-export invariant.
surface:
  - packages/core/src/index.ts
  - packages/explorer/src/index.ts
  - packages/runner/src/index.ts
  - packages/runner/src/bin.ts
  - packages/cli/src/index.ts
  - packages/cli/src/bin.ts
  - packages/tui/src/index.ts
  - packages/tui/src/bin.tsx
